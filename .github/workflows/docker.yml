name: Docker

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, compose.yaml, 'src/**', 'migrations/**', 'web/**', 'resources/**', pyproject.toml, uv.lock, setup.py, MANIFEST.in, scripts/smoke_docker.py, .github/workflows/docker.yml]
  push:
    branches: [master, cursor/qbittorrent-download-0e14]
    tags: ['v*.*.*']
    paths: [Dockerfile, .dockerignore, compose.yaml, 'src/**', 'migrations/**', 'web/**', 'resources/**', pyproject.toml, uv.lock, setup.py, MANIFEST.in, scripts/smoke_docker.py, scripts/release_tag.py, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Linux amd64 镜像验收
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 核对标签提交的主线 CI
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_tag.py --repo "$GITHUB_REPOSITORY" --verify-sha "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v4
      - name: 构建候选镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: longmeidao/peach:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 验收临时容器
        run: python3 scripts/smoke_docker.py longmeidao/peach:test
      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 计算镜像标签
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "value=longmeidao/peach:${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo 'value=longmeidao/peach:edge' >> "$GITHUB_OUTPUT"
          fi
      - name: 发布已验收镜像
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && vars.DOCKERHUB_USERNAME != ''
        env:
          PUBLISH_TAG: ${{ steps.tags.outputs.value }}
        run: |
          docker tag longmeidao/peach:test "$PUBLISH_TAG"
          docker push "$PUBLISH_TAG"
      - name: 登录 GHCR
        if: github.repository == 'kewell2000/peach' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/cursor/qbittorrent-download-0e14')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布到 GHCR
        if: github.repository == 'kewell2000/peach' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/cursor/qbittorrent-download-0e14')
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/peach"
          short=$(git rev-parse --short=7 HEAD)
          docker tag longmeidao/peach:test "${image}:qbit-${short}"
          docker tag longmeidao/peach:test "${image}:qbittorrent"
          docker push "${image}:qbit-${short}"
          docker push "${image}:qbittorrent"
      - name: 尝试把 GHCR 包设为公开
        if: github.repository == 'kewell2000/peach' && github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/cursor/qbittorrent-download-0e14')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            /user/packages/container/peach/visibility -f visibility=public
